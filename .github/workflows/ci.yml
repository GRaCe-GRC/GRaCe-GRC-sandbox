name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f compose/compose.yaml config --quiet
          docker compose -f compose/compose.yaml -f compose/compose.build.yaml config --quiet
