name: grace-grc

services:
  postgres:
    image: postgres:${POSTGRES_TAG:-18-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REGULATORY_API_DB_PASSWORD: ${REGULATORY_API_DB_PASSWORD:-regulatory_api}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "regulatory_api", "-d", "regulatory"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  healthcheck-probe:
    image: eclipse-temurin:${HEALTHCHECK_JDK_TAG:-25-jdk}
    command: ["javac", "--release", "25", "-d", "/probe", "/healthcheck/HealthCheck.java"]
    volumes:
      - ./healthcheck:/healthcheck:ro
      - healthcheck-probe:/probe
    restart: "no"

  regulatory-api:
    image: ${REGULATORY_API_IMAGE:-ghcr.io/grace-grc/regulatory-api}:${REGULATORY_API_TAG:-latest}
    environment:
      REGULATORY_DB_HOST: postgres
      REGULATORY_DB_PORT: 5432
      REGULATORY_DB_NAME: regulatory
      REGULATORY_DB_USERNAME: regulatory_api
      REGULATORY_DB_PASSWORD: ${REGULATORY_API_DB_PASSWORD:-regulatory_api}
    ports:
      - "${REGULATORY_API_PORT:-8080}:8080"
    volumes:
      - healthcheck-probe:/healthcheck:ro
    depends_on:
      postgres:
        condition: service_healthy
      healthcheck-probe:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/layers/paketo-buildpacks_bellsoft-liberica/jre/bin/java", "-cp", "/healthcheck", "HealthCheck", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

  regulatory-ingestion-service:
    image: ${REGULATORY_INGESTION_SERVICE_IMAGE:-ghcr.io/grace-grc/regulatory-ingestion-service}:${REGULATORY_INGESTION_SERVICE_TAG:-latest}
    environment:
      REGULATORY_API_URL: http://regulatory-api:8080
    ports:
      - "${REGULATORY_INGESTION_SERVICE_PORT:-8081}:8080"
    volumes:
      - healthcheck-probe:/healthcheck:ro
    depends_on:
      regulatory-api:
        condition: service_healthy
      healthcheck-probe:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/layers/paketo-buildpacks_bellsoft-liberica/jre/bin/java", "-cp", "/healthcheck", "HealthCheck", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

  admin-console-service:
    image: ${ADMIN_CONSOLE_SERVICE_IMAGE:-ghcr.io/grace-grc/admin-console-service}:${ADMIN_CONSOLE_SERVICE_TAG:-latest}
    environment:
      REGULATORY_INGESTION_SERVICE_URL: http://regulatory-ingestion-service:8080
    ports:
      - "${ADMIN_CONSOLE_SERVICE_PORT:-8082}:8080"
    volumes:
      - healthcheck-probe:/healthcheck:ro
    depends_on:
      regulatory-ingestion-service:
        condition: service_healthy
      healthcheck-probe:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/layers/paketo-buildpacks_bellsoft-liberica/jre/bin/java", "-cp", "/healthcheck", "HealthCheck", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

  admin-console-ui:
    image: ${ADMIN_CONSOLE_UI_IMAGE:-ghcr.io/grace-grc/admin-console-ui}:${ADMIN_CONSOLE_UI_TAG:-latest}
    environment:
      ADMIN_CONSOLE_SERVICE_URL: http://admin-console-service:8080
    ports:
      - "${ADMIN_CONSOLE_UI_PORT:-4200}:80"
    depends_on:
      admin-console-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  healthcheck-probe:
