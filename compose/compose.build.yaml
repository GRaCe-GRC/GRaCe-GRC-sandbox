services:
  regulatory-api:
    image: ${REGULATORY_API_LOCAL_IMAGE:-regulatory-api:local}
    pull_policy: never
  control-api:
    image: ${CONTROL_API_LOCAL_IMAGE:-control-api:local}
    pull_policy: never
  control-mapping-api:
    image: ${CONTROL_MAPPING_API_LOCAL_IMAGE:-control-mapping-api:local}
    pull_policy: never
  regulatory-ingestion-service:
    image: ${REGULATORY_INGESTION_SERVICE_LOCAL_IMAGE:-regulatory-ingestion-service:local}
    pull_policy: never
  admin-console-service:
    image: ${ADMIN_CONSOLE_SERVICE_LOCAL_IMAGE:-admin-console-service:local}
    pull_policy: never
  admin-console-ui:
    image: ${ADMIN_CONSOLE_UI_LOCAL_IMAGE:-admin-console-ui:local}
    build:
      context: ${ADMIN_CONSOLE_UI_SOURCE:-../../admin-console-ui}
